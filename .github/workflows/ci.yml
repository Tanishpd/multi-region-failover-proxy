name: ci

on:
  push: {branches: [main]}
  pull_request:
  schedule:
    # Re-scan the shipped image weekly. The CVE that matters is usually
    # published AFTER you ship, so a build-time gate alone is not enough.
    - cron: "0 6 * * 1"

# ACTION VERSION POLICY: bump only as far as needed to stay on a supported
# Node runtime, not to the newest tag. Every run was printing "Node.js 20 is
# deprecated ... forced to run on Node.js 24" for checkout, setup-python and
# upload-artifact; one major each clears it. checkout/setup-python/
# upload-artifact are at v7 upstream, and jumping four majors to silence a
# warning trades a known deprecation for unknown breaking changes in the one
# workflow that gates every push.

permissions:
  contents: read

jobs:
  unit:
    # The suite that must pass with no Docker daemon at all — the same
    # guarantee `make test-unit` gives a reader locally.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q -m unit

  integration:
    # The Lua token bucket against a REAL Redis. fakeredis would be circular:
    # the Lua semantics are precisely what is under test.
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2-alpine
        ports: ["6380:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - run: pip install -r requirements-dev.txt
      - name: seed the test sentinel
        # The conftest guard refuses to touch a Redis that our own stack did
        # not seed. That guard exists because a developer machine has a real
        # Redis one port away.
        #
        # Via the redis image rather than a bare `redis-cli`: GitHub runners do
        # not ship redis-tools, and the bare call failed with exit 127.
        run: |
          docker run --rm --network host redis:7.2-alpine \
            redis-cli -h 127.0.0.1 -p 6380 -n 15 SET mrfp:test-guard "ci"
      - run: pytest -q -m integration
        env:
          MRFP_REDIS_URL_TEST: redis://127.0.0.1:6380/15

  chaos:
    # Categorical assertions only. The graded timing numbers (A4, A5, A11) were
    # tuned on native arm64; a shared amd64 runner with noisy neighbours would
    # make a 200 ms threshold flap, and a flaky gate is worse than no gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - run: pip install -r requirements-dev.txt
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 120 redis us-east-1-endpoint eu-west-1-endpoint ap-southeast-1-endpoint mrfp-proxy
        env:
          MRFP_ADMIN_TOKEN: ci-admin-token
      - run: docker compose up -d --no-deps redis-guard-seed

      # Gate the PROD profile's timeouts against what the regions actually cost.
      # Safe on a noisy shared runner despite the arm64 caveat above: this
      # compares configured against measured and only fails when a timeout is
      # too SMALL, so runner slowness can only widen the margin. Fewer samples
      # than a local run — the shape is what matters here, not the precision.
      - name: gate the prod timeouts against measurement
        run: bash ops/scripts/calibrate.sh check --samples 8

      - run: bash ops/scripts/chaos.sh stop-us-east --rps 20 --duration 14
        env:
          MRFP_CI: "1"
      - if: always()
        run: docker compose logs --no-log-prefix mrfp-proxy | tail -50
      - if: always()
        uses: actions/upload-artifact@v5
        with: {name: chaos-artifacts, path: artifacts/}

  image:
    needs: [unit, integration]
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write, id-token: write}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: lowercase the image name
        # Container registry names must be lowercase, and github.repository
        # carries the owner's casing verbatim ("Tanishpd/..."), which buildx
        # rejects with "repository name must be lowercase".
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/proxy" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # BUILD -> SCAN -> PUSH, in that order.
      #
      # The first version of this job pushed and then scanned, which publishes
      # a vulnerable image and reports it afterwards — the gate has to come
      # first or it is not a gate. It also meant trivy had to pull from ghcr
      # and had no credentials to do so.
      - name: build (local, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: ./proxy
          tags: ${{ steps.img.outputs.name }}:${{ github.sha }}
          load: true

      - name: vulnerability gate
        # Runs as a PINNED CONTAINER rather than a marketplace action: in a job
        # whose whole purpose is supply-chain assurance, an unverifiable action
        # version is a poor dependency — and the version I first guessed at did
        # not exist. Scans the locally loaded image, so no registry auth is
        # needed and nothing has been published yet.
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1 image \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --format table \
              ${{ steps.img.outputs.name }}:${{ github.sha }}

      - name: push (only after the gate passes)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./proxy
          tags: ${{ steps.img.outputs.name }}:${{ github.sha }}
          push: true
          # SBOM and provenance travel WITH the image digest, rather than as a
          # build artifact nobody can associate with a running container. They
          # are produced at push time, which is why this is a second step
          # rather than a flag on the build above.
          sbom: true
          provenance: mode=max
