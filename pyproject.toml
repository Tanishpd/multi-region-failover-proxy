# Tooling configuration only. There is deliberately no [project] table: nothing
# in this repository is installed as a package. The proxy and region apps run
# from their images; chaos/ and tests/ run from the host venv via `make venv`.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "artifacts"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "ASYNC",    # flake8-async — blocking calls in async paths
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",
]
ignore = [
    "E501",     # line length is handled by the formatter
    "B008",     # FastAPI's Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# The report renders markdown tables for humans; × and — are intentional there.
"chaos/report.py" = ["RUF001"]
"chaos/timeline.py" = ["RUF001"]

[tool.ruff.lint.isort]
# `app` is the package root inside both images (WORKDIR /app), so it is
# first-party here even though it is not installed on the host.
known-first-party = ["app"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Fire-and-forget coroutines that never get awaited are a real bug class here
# (the breaker's pool purge). Make Python's warning fatal in tests.
filterwarnings = [
    "error::RuntimeWarning",
]
markers = [
    "unit: no Docker, no Redis, no sockets — must pass with the daemon stopped",
    "integration: needs Redis on 127.0.0.1:6380 (db 15)",
    "e2e: needs the full stack up",
]
addopts = "-ra --strict-markers --strict-config"
